<section class="contribution-section">
    <h3>Предложить правку или статью</h3>
    <form class="wiki-form" action="https://echo.htmlacademy.ru/" method="post">
        <div class="form-group">
            <label for="username">Ваше имя или никнейм</label>
            <input type="text" id="username" name="username" placeholder="Например, OptimusFan" required>
        </div>
        
        <div class="form-group">
            <label for="category">Раздел вики</label>
            <select id="category" name="category">
                <option value="universes">Вселенные</option>
                <option value="toys">Игрушки</option>
                <option value="comics">Комиксы</option>
                <option value="characters">Персонажи</option>
            </select>
        </div>

        <div class="form-group">
            <label for="material-desc">Описание или текст статьи</label>
            <textarea id="material-desc" name="description" rows="5" placeholder="Поделитесь новой информацией..." required></textarea>
        </div>

        <button type="submit" class="form-submit-btn">Отправить на модерацию</button>
    </form>
</section>
