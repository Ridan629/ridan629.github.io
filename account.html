<body data-page="account">

    <a class="skip-link" href="#main">К содержимому</a>

    <div data-site-header></div>

    <main id="main" class="page narrow">
        <h1 class="page-title">Аккаунт</h1>
        <p class="page-lead">Войдите или создайте аккаунт, чтобы комментировать и писать статьи.</p>

        <div class="auth-grid">

            <form class="form form-single" id="login-form" method="post" action="account.html">
                <h2>Вход</h2>

                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input class="control" type="email" id="login-email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="login-password">Пароль</label>
                    <input class="control" type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>

                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn btn-filled">Войти</button>
            </form>

            <form class="form form-single" id="register-form" method="post" action="account.html">
                <h2>Регистрация</h2>

                <div class="form-field">
                    <label for="reg-name">Имя (его увидят другие)</label>
                    <input class="control" type="text" id="reg-name" name="name" minlength="2" maxlength="30" autocomplete="nickname" required>
                </div>

                <div class="form-field">
                    <label for="reg-email">Email</label>
                    <input class="control" type="email" id="reg-email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="reg-password">Пароль (от 6 символов)</label>
                    <input class="control" type="password" id="reg-password" name="password" minlength="6" autocomplete="new-password" required>
                </div>

                <div class="form-field">
                    <label for="reg-password2">Повторите пароль</label>
                    <input class="control" type="password" id="reg-password2" name="password2" minlength="6" autocomplete="new-password" required>
                </div>

                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn btn-filled">Создать аккаунт</button>
            </form>

        </div>

        <p class="notice">
            Сайт пока работает без сервера: аккаунты, статьи и комментарии сохраняются только в этом браузере.
            Не используйте пароль от других сервисов.
        </p>
    </main>

    <div data-site-footer></div>

    <script src="script.js"></script>
</body>
